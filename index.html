<body>
  <div id="root"></div>
  <a class="fab-app" href="baixar-app.html">Baixar app</a>

  <div id="pwaBar" class="pwa-bar" role="dialog" aria-label="Instalar aplicativo">
    <div>
      <b>Instalar o app</b>
      <span class="sub" style="color:inherit;opacity:.8">Acesso rápido na tela inicial do celular</span>
    </div>
    <div style="display:flex;gap:.4rem">
      <button type="button" id="pwaDismiss" class="pwa-dismiss">Agora não</button>
      <button type="button" id="pwaInstall" class="pwa-install">Instalar</button>
    </div>
  </div>

  <script defer src="vendor/react.production.min.js"></script>
  <script defer src="vendor/react-dom.production.min.js"></script>
  <script defer src="vendor/framer-motion.js"></script>
  <script defer src="app.react.min.js"></script>
  <script>
    if ("serviceWorker" in navigator && location.protocol !== "file:") {
      navigator.serviceWorker.register("./sw.js");
    }
    (function(){
      var deferred = null;
      var bar = document.getElementById("pwaBar");
      var btn = document.getElementById("pwaInstall");
      var hide = document.getElementById("pwaDismiss");
      function standalone(){
        return window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone;
      }
      window.addEventListener("beforeinstallprompt", function(e){
        e.preventDefault();
        deferred = e;
        if (!standalone() && !localStorage.getItem("nexo_pwa_hide")) bar.classList.add("on");
      });
      btn && btn.addEventListener("click", function(){
        if (!deferred) return;
        deferred.prompt();
        deferred.userChoice.finally(function(){ bar.classList.remove("on"); deferred = null; });
      });
      hide && hide.addEventListener("click", function(){
        bar.classList.remove("on");
        try { localStorage.setItem("nexo_pwa_hide", "1"); } catch(e){}
      });
      window.addEventListener("appinstalled", function(){ bar.classList.remove("on"); });
    })();
  </script>
