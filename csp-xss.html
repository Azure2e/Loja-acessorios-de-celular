<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'">
<title>CSP e XSS</title>
</head>
<body style="font-family:system-ui;background:#141414;color:#fff;padding:20px">
<h1>CSP e teste XSS</h1>
<p id="csp">CSP: default-src self; object-src none; script-src self unsafe-inline</p>
<textarea id="pay" rows="3" style="width:100%">&lt;img src=x onerror=alert(1)&gt;</textarea>
<p>
<button type="button" id="safe">Inserir seguro</button>
<button type="button" id="unsafe">Simular inseguro</button>
</p>
<div id="out">Resultado</div>
<p><a href="index.html" style="color:#FF5A1F">Loja</a></p>
<script>
document.getElementById("safe").onclick=function(){
  document.getElementById("out").textContent="Seguro: "+document.getElementById("pay").value;
};
document.getElementById("unsafe").onclick=function(){
  document.getElementById("out").innerHTML="Inseguro: "+document.getElementById("pay").value;
};
</script>
</body>
</html>
